<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Intracranial PCA component dashboard</title>
<style>
:root{--ink:#10243f;--muted:#52657f;--line:#d6e0ea;--blue:#164f86;--paper:#fff;--wash:#eef4fa;--member:#168f65;--partial:#d68b18;--outlier:#c44949}
*{box-sizing:border-box}
body{font-family:Georgia,"Times New Roman",serif;background:var(--wash);color:var(--ink);margin:0;padding:24px}
.shell{max-width:1540px;margin:auto;background:var(--paper);border:1px solid var(--line);padding:28px;border-radius:22px;box-shadow:0 18px 50px rgba(30,59,92,.08)}
h1{font-size:38px;margin:0 0 16px}
.tabs,.controls,.link-row,.legend,.subtabs,.metric-help,.toggle-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tabs{margin-bottom:18px}
.tab,.btn,.subtab{border:1px solid #afbdcc;background:#fff;color:var(--ink);font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:1.2;font-weight:700;padding:9px 13px;cursor:pointer;text-decoration:none}
.tab.active,.subtab.active{background:var(--blue);color:#fff}
.induction-btn{border:1px solid #9eb0c2;background:#fff;color:var(--ink);font:700 14px/1.2 Arial,sans-serif;padding:9px 12px;cursor:pointer}
.induction-btn.active{background:#0f5b99;border-color:#0f5b99;color:#fff}
.induction-controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:14px;border:1px solid var(--line);background:#f8fbfe;margin-bottom:14px}
[hidden]{display:none!important}
.induction-controls[hidden]{display:none}
.induction-title{font:700 15px Arial,sans-serif;margin-right:4px}
.induction-note{flex-basis:100%;font:12px/1.45 Arial,sans-serif;color:var(--muted)}
.panel{display:none}
.panel.active{display:block}
.controls{padding:14px;border:1px solid var(--line);background:#f8fbfe;margin-bottom:14px}
.controls label{font-weight:700}
.controls select{min-width:210px;padding:8px;background:#fff;border:1px solid #aebccc}
.threshold{flex:1;min-width:280px}
.threshold input{width:100%}
.card{border:1px solid var(--line);padding:16px;background:#fff;margin-top:14px}
.card h2{margin:0 0 8px;font-size:26px}
.muted{color:var(--muted);font-family:Arial,sans-serif}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin:12px 0}
.stat{border:1px solid var(--line);padding:10px;background:#fafcff}
.stat b{display:block;font:12px Arial;color:var(--muted);text-transform:uppercase}
.stat span{font:700 18px Arial}
.stat small{display:block;margin-top:6px;font:12px/1.35 Arial;color:var(--muted)}
.legend{font:700 13px Arial;margin:10px 0}
.legend:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);padding:6px 9px;background:#fff}
.swatch{display:inline-block;width:11px;height:11px;border-radius:2px}
.plot-host{width:100%;min-height:0;position:relative}
.embedding-empty{padding:30px;border:1px dashed #afbdcc;background:#fbfdff;color:var(--muted);font:15px/1.5 Arial,sans-serif}
.embedding-figure{display:flex;flex-direction:column;gap:14px}
.embedding-legend-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.embedding-legend-chip{display:inline-flex;gap:7px;align-items:center;padding:6px 10px;border:1px solid var(--line);background:#fafcff;font:12px/1.3 Arial,sans-serif}
.embedding-legend-note{font:12px/1.45 Arial,sans-serif;color:var(--muted)}
.embedding-colorbar{display:flex;flex-direction:column;gap:6px}
.embedding-colorbar-bar{height:12px;border-radius:999px;border:1px solid var(--line);background:linear-gradient(90deg,#30123b 0%,#4145ab 16%,#2c7ef7 33%,#1fb9b8 50%,#73d055 67%,#fde725 84%,#f97b1d 100%)}
.embedding-colorbar-labels{display:flex;justify-content:space-between;font:12px Arial,sans-serif;color:var(--muted)}
.embedding-panel-card{border:1px solid var(--line);background:#fff;padding:10px;display:flex;flex-direction:column;min-height:560px}
.embedding-panel-heading{margin:0 0 8px;font:700 16px/1.2 Arial,sans-serif;color:var(--ink)}
.embedding-plot-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(440px,1fr));gap:14px}
.embedding-svg{display:block;width:100%;height:520px;min-height:520px;background:#fff;flex:1 1 auto}
.embedding-axis-title{font:700 13px Arial;fill:#10243f}
.embedding-zero-line{stroke:#94a3b8;stroke-width:1;stroke-dasharray:5 4}
.embedding-canvas-shell{border:1px solid var(--line);background:linear-gradient(180deg,#fbfdff 0%,#f3f8fd 100%);padding:12px}
.embedding-toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px}
.embedding-toolbar-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.embedding-view-btn{border:1px solid var(--line);background:#fff;color:var(--ink);font:700 12px Arial;padding:7px 10px;cursor:pointer}
.embedding-view-btn:hover{background:#eef4fa}
.embedding-canvas-hint,.metric-help{font:12px/1.5 Arial,sans-serif;color:var(--muted)}
.embedding-canvas-wrap{position:relative}
.embedding-canvas{display:block;width:100%;height:760px;background:#fff;border:1px solid var(--line);cursor:grab}
.embedding-canvas.dragging{cursor:grabbing}
.embedding-canvas-footer{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:10px;font:12px/1.45 Arial,sans-serif;color:var(--muted)}
.toggle-row label{display:inline-flex;align-items:center;gap:6px;font:700 14px Arial,sans-serif}
.toggle-row input{width:16px;height:16px}
.metric-help{margin:0 0 8px}
svg{display:block;width:100%;height:auto;background:#fff}
.axis{stroke:#14263d;stroke-width:1.35}
.grid{stroke:#e6ecf2;stroke-width:1}
.tick{font:12px Arial;fill:#334155}
.axis-label{font:700 14px Arial;fill:#10243f}
.bar-segment{cursor:pointer}
.bar-outline{fill:none;stroke:#12263f;stroke-width:1.1}
.hist-curve{fill:none;stroke:#12263f;stroke-width:2.2}
.hist-stat-line{stroke:#334155;stroke-width:1.35;stroke-dasharray:7 5}
.hist-stat-label{font:700 12px Arial;fill:#334155}
.electrode-line{fill:none;stroke-width:1.1;opacity:.42;pointer-events:none;transition:stroke-width .12s ease,opacity .12s ease}
.electrode-line.hovered{stroke-width:3.2;opacity:1}
.trajectory-hit{fill:none;stroke:transparent;stroke-width:14;pointer-events:stroke;cursor:crosshair}
.trajectory-hover-info{margin:12px 0 4px;padding:12px 14px;border:1px solid #bfd0df;border-left:5px solid #209969;background:#f7fbf9;min-height:64px;font:13px/1.45 Arial,sans-serif;color:var(--ink)}
.trajectory-hover-info strong{display:block;margin-bottom:6px;font:700 15px/1.25 Arial,sans-serif}
.trajectory-hover-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:5px 16px}
.trajectory-hover-grid span{overflow-wrap:anywhere}
.mean-line{fill:none;stroke:#111827;stroke-width:3}
.pc1-line,.pc2-line,.pc3-line{fill:none;stroke-width:5;stroke-linecap:round;opacity:1}
.pc1-line{stroke:#e24a33}
.pc2-line{stroke:#6d28d9}
.pc3-line{stroke:#db2777;stroke-dasharray:12 7}
.cohort-pca-line{fill:none;stroke-width:2.6;opacity:.78;cursor:pointer}
.event-line{stroke:#334155;stroke-width:1.4;stroke-dasharray:6 5}
.tooltip{position:fixed;pointer-events:none;opacity:0;background:#101827;color:#fff;padding:10px;max-width:390px;font:12px Arial;line-height:1.45;z-index:20}
.corr-image{display:block;width:100%;height:auto;max-height:calc(100vh - 240px);object-fit:contain;pointer-events:none}
.scroll{overflow:auto}
.empty-note{padding:20px;background:#f8fbfe;border:1px solid var(--line)}
@media(max-width:900px){body{padding:10px}.shell{padding:16px}h1{font-size:30px}.embedding-canvas{height:620px}}
</style><script src="plotly.min.js"></script></head><body><main class="shell"><h1>Dashboard</h1>
<div class="tabs"><button class="tab active" data-tab="distribution">Timing distributions</button><button class="tab" data-tab="trajectories">Patient trajectories + PCA</button><button class="tab" data-tab="embedding">PCA Embedding</button><button class="tab" data-tab="correlations">Correlations</button><a class="btn" href="brain_delta_plateau_timing_map.html?v=b1c7771b1281">Cohort brain map</a></div>

<div class="induction-controls" id="inductionControls" hidden><span class="induction-title">Induction-rate cohort</span><button type="button" class="induction-btn" data-induction-mode="rate_05">0.5 mcg/kg/min only</button><button type="button" class="induction-btn" data-induction-mode="rate_10">1.0 mcg/kg/min only</button><button type="button" class="induction-btn active" data-induction-mode="normalized_combined">Combined, normalized to 1.0</button><span class="induction-note" id="inductionNote"></span></div>
<section id="distributionPanel" class="panel active"><div class="controls"><label>View</label><select id="histView"></select><label>Band</label><select id="histBand"><option>delta</option><option>beta</option><option>gamma</option></select><label>Bin width</label><input id="binWidth" type="range" min="1" max="30" value="5" step=".5"><span id="binLabel"></span></div><div class="card"><h2 id="histTitle"></h2><div class="legend" id="histLegend"></div><div class="stats" id="histStats"></div><svg id="histSvg" viewBox="0 0 1280 650"></svg></div></section>
<section id="trajectoriesPanel" class="panel"><div class="controls"><label>Patient</label><select id="trajPatient"></select><label>Band</label><select id="trajBand"><option>delta</option><option>beta</option><option>gamma</option></select><div class="subtabs" id="channelGroupTabs"><button type="button" class="subtab active" data-group="mixed">Mixed</button><button type="button" class="subtab" data-group="implanted">Implanted</button><button type="button" class="subtab" data-group="scalp">Scalp</button></div><label><input id="extendedWindow" type="checkbox"> Extended PCA window</label><div class="toggle-row"><label><input id="showMean" type="checkbox" checked> Mean</label><label><input id="showPc1" type="checkbox" checked> PC1</label><label><input id="showPc2" type="checkbox"> PC2</label><label><input id="showPc3" type="checkbox"> PC3</label></div></div><div class="card"><h2 id="trajTitle"></h2><p class="muted" id="trajSubtitle"></p><div class="legend" id="trajLegend"></div><div id="trajHoverInfo" class="trajectory-hover-info" aria-live="polite"><strong>Electrode information</strong><span>Hover over an electrode trajectory to display its identity, localization, and PCA metrics here.</span></div><svg id="trajSvg" viewBox="0 0 1280 680"></svg></div></section>
<section id="embeddingPanel" class="panel"><div class="controls"><label>Patient scope</label><select id="embedPatient"></select><label>Band</label><select id="embedBand"><option>delta</option><option>beta</option><option>gamma</option></select><div class="subtabs" id="embedChannelGroupTabs"><button type="button" class="subtab active" data-group="mixed">Mixed</button><button type="button" class="subtab" data-group="implanted">Implanted</button><button type="button" class="subtab" data-group="scalp">Scalp</button></div><label>PCA window</label><div class="subtabs" id="embedTimeModeTabs"><button type="button" class="subtab active" data-mode="analysis_window">Standard PCA window</button><button type="button" class="subtab" data-mode="full_recording">Full recording PCA</button></div><label>Color by</label><select id="embedColorBy"></select><label>Point size</label><select id="embedSizeBy"></select><div class="toggle-row"><label><input id="embedShowPc1" type="checkbox" checked> PC1</label><label><input id="embedShowPc2" type="checkbox" checked> PC2</label><label><input id="embedShowPc3" type="checkbox" checked> PC3</label></div></div><div class="card"><h2 id="embedTitle"></h2><p class="muted" id="embedSubtitle"></p><div class="stats" id="embedStats"></div><p id="embedMetricHelp" class="metric-help"></p><div id="embeddingEmpty" class="embedding-empty" style="display:none"></div><div id="embeddingPlot" class="plot-host"></div></div></section>
<section id="correlationsPanel" class="panel"><div class="card"><h2>Correlations</h2><div class="scroll"><div class="correlation-variant" data-induction-mode="rate_05" hidden><img class="corr-image" src="intracranial_correlation_grid_rate_05.svg?v=b1c7771b1281" alt="Intracranial correlation grid - 0.5 mcg/kg/min"></div><div class="correlation-variant" data-induction-mode="rate_10" hidden><img class="corr-image" src="intracranial_correlation_grid_rate_10.svg?v=b1c7771b1281" alt="Intracranial correlation grid - 1.0 mcg/kg/min"></div><div class="correlation-variant" data-induction-mode="normalized_combined"><img class="corr-image" src="intracranial_correlation_grid.svg?v=b1c7771b1281" alt="Intracranial correlation grid - Combined, normalized to 1.0"></div></div></div></section>
</main><div id="tooltip" class="tooltip"></div><script>

<script>
const entries=window.__DASHBOARD_ENTRIES__;
const trajectories=window.__DASHBOARD_TRAJECTORIES__;
const embeddingRows=window.__DASHBOARD_EMBEDDING_ROWS__;
const classOrder=[["component_member", "Component member", "#168F65"], ["component_partial_member", "Component partial member", "#D68B18"], ["component_outlier", "Component outlier", "#C44949"]];
const $=id=>document.getElementById(id);
const tooltip=$('tooltip');
let threshold=0;
let activeDashboardTab='distribution';
let inductionMode='normalized_combined';
let activeChannelGroup='mixed';
let embedChannelGroup='mixed';
let embedTimeMode='analysis_window';
const inductionRate05Patients=new Set(['P1001','P1002','P1003','P1004','P1005','P1006','P1007','P1008']);
const categoricalEmbeddingMetrics=new Set(['anatomical_region','patient_id','hemisphere','dominant_component']);
const embeddingColorOptions=[['anatomical_region','Anatomical region'],['patient_id','Patient'],['hemisphere','Hemisphere'],['dominant_component','Dominant component'],['component_concordance_score','PCA concordance score'],['reconstruction_corr','Reconstruction correlation'],['delta_lag_sec','Delta lag'],['beta_lag_sec','Beta lag'],['gamma_lag_sec','Gamma lag'],['object_drop_relative_timing_sec','Object-drop-relative timing']];
const embeddingSizeOptions=[['uniform','Uniform'],['component_concordance_score','PCA concordance score'],['reconstruction_corr','Reconstruction correlation'],['dominant_component_weight','Dominant component weight']];
const embeddingPalette=['#2563eb','#16a34a','#dc2626','#d97706','#7c3aed','#db2777','#0f766e','#4f46e5','#b45309','#059669','#c026d3','#475569','#f43f5e','#65a30d','#0891b2','#ea580c','#3b82f6','#14b8a6','#9333ea','#be123c','#a16207','#0ea5e9','#10b981','#ef4444'];
const embeddingColorHelp={
  anatomical_region:'Colors each point by the atlas/localization region attached to that electrode.',
  patient_id:'Colors each point by patient of origin.',
  hemisphere:'Colors each point by hemisphere label.',
  dominant_component:'Colors each point by the retained PCA component with the largest membership weight for that electrode.',
  component_concordance_score:'Uses a continuous scale for component_concordance_score = max(0, reconstruction correlation) × dominant component weight.',
  reconstruction_corr:'Uses a continuous scale for the correlation between the electrode trajectory and its PCA reconstruction.',
  delta_lag_sec:'Uses a continuous scale for delta plateau lag relative to object drop.',
  beta_lag_sec:'Uses a continuous scale for beta nadir lag relative to object drop.',
  gamma_lag_sec:'Uses a continuous scale for gamma nadir lag relative to object drop.',
  object_drop_relative_timing_sec:'Uses a continuous scale for the active timing lag of the selected band relative to object drop.'
};
const embeddingSizeHelp={
  uniform:'Every included point uses the same radius.',
  component_concordance_score:'Larger points have higher component_concordance_score after robust size normalization.',
  reconstruction_corr:'Larger points have stronger electrode-to-reconstruction correlation after robust size normalization.',
  dominant_component_weight:'Larger points have a stronger membership weight in their dominant retained PCA component after robust size normalization.'
};
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmt(v,d=1){return Number.isFinite(Number(v))?Number(v).toFixed(d).replace(/\.0$/,''):'NA'}
function svgEl(svg,tag,attrs){const el=document.createElementNS('http://www.w3.org/2000/svg',tag);Object.entries(attrs).forEach(([key,val])=>el.setAttribute(key,val));svg.appendChild(el);return el}
function clear(svg){while(svg.firstChild)svg.removeChild(svg.firstChild)}
function showTip(evt,title,lines){tooltip.innerHTML=(title?'<b>'+esc(title)+'</b>':'')+lines.map(x=>'<div>'+x+'</div>').join('');tooltip.style.left=Math.min(evt.clientX+14,window.innerWidth-410)+'px';tooltip.style.top=Math.min(evt.clientY+14,window.innerHeight-220)+'px';tooltip.style.opacity=1}
function hideTip(){tooltip.style.opacity=0}
function sortedUnique(values){return [...new Set(values.map(v=>String(v??'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true,sensitivity:'base'}))}
function optionLabel(defs,key){const hit=defs.find(item=>item[0]===key);return hit?hit[1]:key}
function populateMetricSelect(selectId,defs,selectedValue){const select=$(selectId);defs.forEach(([value,label])=>{const option=document.createElement('option');option.value=value;option.textContent=label;select.appendChild(option)});if(selectedValue)select.value=selectedValue}
function numberArray(values){return (values||[]).map(v=>v===null?NaN:Number(v))}
function inductionRate(patientId){return inductionRate05Patients.has(String(patientId||''))?.5:1}
function patientMatchesInductionMode(patientId){const rate=inductionRate(patientId);return inductionMode==='rate_05'?rate===.5:inductionMode==='rate_10'?rate===1:true}
function cohortTimeValue(value,patientId){const parsed=Number(value);if(!Number.isFinite(parsed))return NaN;return inductionMode==='normalized_combined'?parsed*inductionRate(patientId):parsed}
function cohortTimeArray(values,patientId){return numberArray(values).map(value=>cohortTimeValue(value,patientId))}
function isMultiPatientContext(){
  if(activeDashboardTab==='correlations')return true;
  if(activeDashboardTab==='distribution')return activeEntry()?.view_type==='region';
  if(activeDashboardTab==='trajectories')return $('trajPatient').value==='__all__';
  if(activeDashboardTab==='embedding')return $('embedPatient').value==='__all__';
  return false;
}
function updateContextControls(){
  const thresholdNeeded=activeDashboardTab==='distribution'||activeDashboardTab==='embedding'||(activeDashboardTab==='trajectories'&&$('trajPatient').value!=='__all__');
  $('thresholdControls').hidden=!thresholdNeeded;
  const multi=isMultiPatientContext();
  $('inductionControls').hidden=!multi;
  if(multi){
    const normalized=inductionMode==='normalized_combined';
    $('inductionNote').textContent=normalized
      ?'Exploratory 1.0-equivalent clock: temporal values from 0.5 patients are multiplied by 0.5. PSD amplitudes and PCA coordinates are unchanged.'
      :'Patients are filtered by recorded propofol induction rate; displayed temporal values remain in recorded seconds.';
  }
  document.querySelectorAll('.correlation-variant').forEach(node=>node.hidden=node.dataset.inductionMode!==inductionMode);
}
function setInductionMode(mode){
  inductionMode=mode;
  document.querySelectorAll('.induction-btn').forEach(btn=>btn.classList.toggle('active',btn.dataset.inductionMode===mode));
  updateContextControls();
  redraw();
}
function histStat(label,value,explanation){return '<div class="stat"><b>'+label+'</b><span>'+value+'</span>'+(explanation?'<small>'+explanation+'</small>':'')+'</div>'}
function pointLabel(point){const region=String(point.region||'localisation unavailable').trim()||'localisation unavailable';return esc(point.member_name)+' — '+esc(region)}
function pathD(xs,ys,xScale,yScale){let d='';let open=false;for(let i=0;i<Math.min(xs.length,ys.length);i++){const xValue=Number(xs[i]);const yValue=Number(ys[i]);if(Number.isFinite(xValue)&&Number.isFinite(yValue)){d+=(open?' L':'M')+xScale(xValue)+' '+yScale(yValue);open=true}else{open=false}}return d}
function groupLabel(value){return ({mixed:'mixed scalp + implanted',implanted:'implanted channels only',scalp:'scalp/extracerebral channels only'}[value]||value)}
function timeModeLabel(value){return value==='full_recording'?'full recording PCA':'standard PCA window'}
function activeTimeMode(){return $('extendedWindow').checked?'full_recording':'analysis_window'}
function resetTrajectoryInfo(message='Hover over an electrode trajectory to display its identity, localization, and PCA metrics here.'){
  $('trajHoverInfo').innerHTML='<strong>Electrode information</strong><span>'+esc(message)+'</span>';
}
function showTrajectoryInfo(entry,point){
  const region=String(point.region||'').trim()||'N/A';
  const name=String(point.electrode_name||'').trim()||'N/A';
  $('trajHoverInfo').innerHTML='<strong>'+esc(name)+'</strong><div class="trajectory-hover-grid">'
    +'<span><b>Patient:</b> '+esc(entry.patient_id)+'</span>'
    +'<span><b>Anatomical region:</b> '+esc(region)+'</span>'
    +'<span><b>Channel group:</b> '+esc(groupLabel(activeChannelGroup))+'</span>'
    +'<span><b>Dominant component:</b> PC'+esc(point.dominant_component||'N/A')+'</span>'

function embeddingCategoryValue(row,metric){
  if(metric==='anatomical_region')return row.anatomical_region||'N/A';
  if(metric==='patient_id')return row.patient_id||'N/A';
  if(metric==='hemisphere')return row.hemisphere||'N/A';
  if(metric==='dominant_component')return row.dominant_component||'N/A';
  return 'N/A';
}
function embeddingContinuousValue(row,metric){return Number(row?.[metric])}
function embeddingQuantile(sortedValues,q){
  if(!sortedValues.length)return NaN;
  const pos=(sortedValues.length-1)*q;
  const lo=Math.floor(pos);
  const hi=Math.ceil(pos);
  if(lo===hi)return sortedValues[lo];
  const t=pos-lo;
  return sortedValues[lo]*(1-t)+sortedValues[hi]*t;
}
function embeddingSizes(rows,metric){
  if(metric==='uniform')return rows.map(()=>10);
  const values=rows.map(row=>embeddingContinuousValue(row,metric)).filter(Number.isFinite).sort((a,b)=>a-b);
  if(!values.length)return rows.map(()=>10);
  const lo=embeddingQuantile(values,.1);
  const hi=embeddingQuantile(values,.9);
  if(!Number.isFinite(lo)||!Number.isFinite(hi)||hi<=lo)return rows.map(()=>14);
  return rows.map(row=>{
    const raw=embeddingContinuousValue(row,metric);
    if(!Number.isFinite(raw))return 8;
    const clipped=Math.max(lo,Math.min(hi,raw));
    return 7+((clipped-lo)/(hi-lo))*15;
  });
}
function embeddingAxisLabel(rows,key,label){
  if($('embedPatient').value==='__all__')return label+' score (patient-specific axis)';
  const hit=rows.find(row=>Number.isFinite(Number(row[key])));
  if(!hit)return label+' score';
  return label+' — '+fmt(Number(hit[key])*100,1)+'% explained variance';
}

function embeddingClamp(value,lo,hi){return Math.max(lo,Math.min(hi,value))}
function buildEmbedding3DPoints(rows,rowMeta){

    const sorted=values.filter(Number.isFinite).sort((a,b)=>a-b);
    if(!sorted.length)return{center:0,span:1};
    const center=embeddingQuantile(sorted,.5);
    const lo=embeddingQuantile(sorted,.08);
    const hi=embeddingQuantile(sorted,.92);
    const span=Math.max(Math.abs(hi-center),Math.abs(center-lo),1e-6);
    return{center:Number.isFinite(center)?center:0,span};
  }
  const axis1=robustAxis(rows.map(row=>Number(row.pc1_score)));
  const axis2=robustAxis(rows.map(row=>Number(row.pc2_score)));
  const axis3=robustAxis(rows.map(row=>Number(row.pc3_score)));
  const sceneScale=1.55;
  return rows.map(row=>{
    const x=embeddingClamp(((Number(row.pc1_score)-axis1.center)/axis1.span)*sceneScale,-2.4,2.4);
    const y=embeddingClamp(((Number(row.pc2_score)-axis2.center)/axis2.span)*sceneScale,-2.4,2.4);
    const z=embeddingClamp(((Number(row.pc3_score)-axis3.center)/axis3.span)*sceneScale,-2.4,2.4);

function renderEmbedding3D(host,rows,rowMeta,axisLabels,colorMetric,continuousDomain){

  stats.innerHTML=[
    embeddingStatHtml('Electrodes plotted',String(plotRows.length),'Finite PCA coordinates rendered in the current view after thresholding.'),
    embeddingStatHtml('Patients represented',String(patientCount),patientValue==='__all__'?'Patients contributing to this exploratory overlay.':'Single-patient PCA view.')
  ].join('');
  const sizeValues=embeddingSizes(plotRows,sizeMetric);
  const rowMeta=new Map();
  const continuousDomain=embeddingContinuousDomain(plotRows,colorMetric);
  if(categoricalEmbeddingMetrics.has(colorMetric)){
    const categories=sortedUnique(plotRows.map(row=>embeddingCategoryValue(row,colorMetric)));
    plotRows.forEach((row,index)=>rowMeta.set(row,{radius:embeddingRadius(sizeValues[index]),color:embeddingCategoryColor(colorMetric,embeddingCategoryValue(row,colorMetric),categories.indexOf(embeddingCategoryValue(row,colorMetric)))}));
  }else{
    plotRows.forEach((row,index)=>rowMeta.set(row,{radius:embeddingRadius(sizeValues[index]),color:embeddingContinuousColor(embeddingContinuousValue(row,colorMetric),continuousDomain)}));
  }
  if(mode==='3d'){
    renderEmbedding3D(host,plotRows,rowMeta,axisLabels,colorMetric,continuousDomain);
    return;
  }
  const figure=document.createElement('div');
  figure.className='embedding-figure';
  renderEmbeddingLegend(figure,plotRows,colorMetric,rowMeta,continuousDomain);
  const pairAxes=selectedAxes.slice(0,2);
  renderEmbeddingPair(
    figure,
    pairAxes[0].label+' vs '+pairAxes[1].label,
    pairAxes[0].key,
    pairAxes[1].key,
    axisLabels[pairAxes[0].label.toLowerCase()],
    axisLabels[pairAxes[1].label.toLowerCase()],
    plotRows,
    rowMeta
  );
  host.appendChild(figure);
}

  drawHist();
  drawTraj();
  if(embeddingPanelIsActive())scheduleEmbeddingRender();
}
